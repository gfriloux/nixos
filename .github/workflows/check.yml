name: Nix flake check

# This job never gets a secret. Everything sops-encrypted stays encrypted:
# evaluation only reads the YAML structure, decryption happens at activation
# on each host. Keep it that way:
# - no `secrets.*`, no age key, no SSH key in this file
# - `pull_request` only, never `pull_request_target` (that one runs fork code
#   with the base repo's token and secrets)
# - read-only token; the Nix installer only uses it against GitHub's API rate
#   limit when fetching inputs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # Evaluates every nixosConfiguration and builds the checks, i.e. STC's
      # purity seals (nix linters, gitleaks, markdown). `--no-build` would skip
      # the seals, which are derivations.
      - name: nix flake check
        run: nix flake check --print-build-logs --show-trace

  # flake check only evaluates the systems and never looks at the homes. This
  # builds both, one job per host so the home reuses the host's closure. The
  # standalone homes differ from the ones embedded in the systems (snowfall's
  # channel pkgs vs the system's), so they are built on their own.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: clochette
            homes: guillaume@clochette weechat@clochette
          - host: RogueLeader
            homes: guillaume@RogueLeader
          - host: exampleHost
            homes: kuri@exampleHost
    steps:
      # exampleHost's closure unpacks to ~21 GiB, more than the runner has
      # free. These preinstalled toolchains are unused here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Build ${{ matrix.host }}
        run: |
          targets=(".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel")
          for home in ${{ matrix.homes }}; do
            targets+=(".#homeConfigurations.\"$home\".activationPackage")
          done
          nix build --no-link --print-build-logs --show-trace "${targets[@]}"

      - name: Disk usage
        if: always()
        run: df -h /
